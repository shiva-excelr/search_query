          title: Path
          type: string
        type:
          title: Type
          type: string
      required:
      - name
      - type
      - path
      title: Agent
      type: object
    AgentWorkflow:
      properties:
        name:
          title: Name
          type: string
        type:
          title: Type
          type: string
        workflow:
          items:
            $ref: '#/components/schemas/Agent'
          title: Workflow
          type: array
      required:
      - name
      - type
      - workflow
      title: AgentWorkflow
      type: object
    AppGPTBotCreationConfig:
      properties:
        agent_workflow:
          anyOf:
          - $ref: '#/components/schemas/AgentWorkflow'
          - type: 'null'
          examples:
          - name: agent
            type: agent
            workflow:
            - name: Document Verification
              path: /api/v1/agent/document-verification
              type: DocumentVerification
            - name: Credit Score Fetcher
              path: /api/v1/agent/credit-score-fetcher
              type: CreditScoreFetcher
            - name: Credit Score Verification
              path: /api/v1/agent/credit-verification
              type: CreditScoreVerification
            - name: Risk Computer
              path: /api/v1/agent/risk-computer
              type: RiskComputer
            - name: Eligibility and Risk Assessment
              path: /api/v1/agent/eligibility-risk-assessment
              type: EligibilityAndRiskAssessment
            - name: Loan Application Final Decision
              path: /api/v1/agent/loan-application-decision
              type: LoanApplicationFinalDecision
        bot_config:
          anyOf:
          - type: object
          - type: 'null'
          default: {}
          title: Bot Config
        bot_record_id:
          title: Bot Record Id
          type: string
        bot_use_case:
          allOf:
          - $ref: '#/components/schemas/BotUseCase'
          default: lead_generation
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        emails:
          default: []
          items:
            type: string
          title: Emails
          type: array
        functions_openapi_spec:
          anyOf:
          - type: object
          - type: 'null'
          title: Functions Openapi Spec
        knowledge_base:
          $ref: '#/components/schemas/AppGPTKnowledgeBaseConfig'
      required:
      - knowledge_base
      - bot_record_id
      title: AppGPTBotCreationConfig
      type: object
    AppGPTBotUpdationConfig:
      properties:
        bot_record_id:
          title: Bot Record Id
          type: string
        knowledge_base:
          $ref: '#/components/schemas/AppGPTKnowledgeBaseConfig'
      required:
      - knowledge_base
      - bot_record_id
      title: AppGPTBotUpdationConfig
      type: object
    AppGPTKnowledgeBaseConfig:
